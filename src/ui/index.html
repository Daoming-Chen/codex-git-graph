<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Git Graph</title><style>/* STYLES */</style></head><body>
<div id="app"><header class="bar"><strong id="repo-name">Git Graph</strong><button id="worktree-menu" title="浏览与设置操作工作区">Worktree</button><span id="branch" class="tag"></span><span class="grow"></span><button id="refresh">刷新</button><button id="more">更多</button></header>
<div class="bar tools"><button id="nav-toggle">导航</button><select id="scope" aria-label="历史范围"><option value="">全部历史</option></select><input id="search" type="search" class="grow" aria-label="查找已加载的提交、作者、引用或 SHA" placeholder="查找已加载的提交、作者、引用或 SHA"><button id="prev" aria-label="上一命中">上一个</button><button id="next" aria-label="下一命中">下一个</button><button id="head">HEAD</button><button id="detail-toggle">详情</button></div>
<form id="repo-form" hidden><label>仓库绝对路径 <input id="repo-input" required></label><button>打开仓库</button></form><div id="error" role="alert" hidden></div>
<div id="workspace"><nav id="nav" aria-label="引用与 Worktree 导航"></nav><main id="main"><section id="history-panel" aria-label="提交历史"><div class="table-head row"><span>图</span><span>引用 / 提交摘要</span><span class="author">作者</span><span class="date">日期</span><span class="sha">SHA</span><span></span></div><div id="history-scroll" tabindex="0" aria-label="提交历史，使用上下键选择"><div id="history"></div><button id="load-more" hidden>继续加载 300 条</button><p id="empty" hidden>尚无提交。选择工作区，审阅并暂存文件后创建首次提交。</p></div></section>
<aside id="detail" aria-label="选择对象详情" hidden><div class="detail-bar"><strong id="detail-label">详情</strong><span class="grow"></span><button id="expand-detail">展开详情</button><button id="dock-detail">底部</button><button id="close-detail" aria-label="关闭详情">关闭</button></div><div id="detail-meta"></div><div id="detail-tabs"></div><div id="detail-content"><div id="files"></div><div id="diff-pane"><div id="diff-title"></div><div id="diff"></div></div></div><div id="commit-pane" hidden></div></aside></main></div>
<footer><span id="summary">读取本地 Git 数据</span><span id="matches"></span></footer></div>
<dialog id="menu"><div id="menu-content"></div><button id="close-menu">关闭</button></dialog><dialog id="action-dialog"><form id="action-form"><h2 id="action-title"></h2><div id="action-fields"></div><p id="action-error" role="alert"></p><pre id="action-preview" hidden></pre><div class="dialog-actions"><button type="button" id="cancel-action">取消</button><button type="submit" id="action-submit">检查操作</button></div></form></dialog>
<script>/* SCRIPT */</script></body></html>
